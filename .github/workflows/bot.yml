name: Supertrend Bot

on:
  schedule:
    # Every 5 minutes, offset from :00/:30 where GitHub is busiest.
    # GitHub may start runs a few minutes late — the bot is built for that.
    - cron: "3-59/5 * * * *"
  workflow_dispatch:          # lets you run it by hand from the Actions tab

# Never run two copies at once (they would fight over paper_trades.json)
concurrency:
  group: supertrend-bot
  cancel-in-progress: false

permissions:
  contents: write             # needed to commit paper_trades.json back

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot (one pass)
        env:
          TELEGRAM_TOKEN:  ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID:         ${{ secrets.CHAT_ID }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        run: python supertrend_bot.py

      - name: Save paper-trade state and settings
        if: always()
        run: |
          git config user.name  "supertrend-bot"
          git config user.email "supertrend-bot@users.noreply.github.com"
          git add paper_trades.json strategy_settings.json
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "bot: update paper trades [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
